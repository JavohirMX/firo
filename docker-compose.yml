services:
  firo:
    image: ghcr.io/firo/firo:latest
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/data # SQLite + assets
    ports:
      - "8080:8080"
    environment:
      FIRO_SECRET: ${FIRO_SECRET:-} # generated on first run
      FIRO_URL: ${FIRO_URL:-https://firo.example.com}
    restart: unless-stopped
