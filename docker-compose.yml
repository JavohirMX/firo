services:
  firo:
    image: ghcr.io/javohirmx/firo:latest
    # Nothing pullable exists under this name yet; build locally rather
    # than pull. Remove the line once a release pipeline publishes images.
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./data:/data # SQLite + assets
    ports:
      - "8080:8080"
    environment:
      # Registration is open by default. Set to "false" once your users exist.
      FIRO_OPEN_REGISTRATION: ${FIRO_OPEN_REGISTRATION:-true}
    restart: unless-stopped
